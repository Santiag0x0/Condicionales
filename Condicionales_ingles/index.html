<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>English Conditionals Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #00d4ff;
      text-shadow: 0 0 10px #00d4ff88;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .start-btn {
      background: #00d4ff;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      color: #000;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px #00d4ffaa;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00d4ffcc;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1>Master the Conditionals!</h1>
  <p>Welcome to the ultimate game to test your knowledge of English conditional sentences! Explore zero, first, second, and mixed conditionals in a fun and interactive way.</p>
  <button class="start-btn" onclick="location.href='explicacion_tema.html'">Start Game</button>

  <footer>
    © 2025 English Grammar Quest
  </footer>
</body>
</html>
